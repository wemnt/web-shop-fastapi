services:
  nats:
    image: nats:2.11-alpine
    command: ["-js", "-sd", "/data", "-m", "8222"]
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - nats:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8222/healthz"]
      interval: 2s
      timeout: 3s
      retries: 15

  web:
    # Build the image from the Dockerfile in the current directory
    build: .

    volumes:
      - ./migrations:/app/migrations
      - ./alembic.ini:/app/alembic.ini

    # Host the FastAPI application on port 8000
    ports:
      - "8000:8000"

    environment:
      # Include development dependencies when working locally
      UV_NO_DEV: "0"

    # Run as root during development so the environment is mutable
    # Alternatively, you could set `UV_PROJECT_ENVIRONMENT` to a path owned by the non-root user
    user: root

    env_file: .env

    develop:
      # Create a `watch` configuration to update the app
      # https://docs.docker.com/compose/file-watch/#compose-watch-versus-bind-mounts
      watch:
        # Sync the working directory with the `/app` directory in the container
        - action: sync
          path: .
          target: /app
          # Exclude the project virtual environment — it could be for a
          # different platform in the container
          ignore:
            - .venv/

        # Rebuild the image if dependencies change by checking uv.lock
        - action: rebuild
          path: ./uv.lock
    depends_on:
      db:
        condition: service_healthy
      nats:
        condition: service_healthy

  db:
    image: postgres:18
    env_file: .env
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 15

  worker:
    build: .
    command: uv run faststream run --app-dir src worker.main:app
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      nats:
        condition: service_healthy

volumes:
  pgdata:
  nats:
