[project]
name = "web-shop-fastapi"
version = "0.1.0"
description = "Online store backend on FastAPI and async SQLAlchemy"
readme = "README.md"
authors = [
    { name = "Artem Ryazanov", email = "wemnts@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.31.0",
    "fastapi[standard]>=0.141.1",
    "faststream[nats]>=0.7.7",
    "phonenumbers>=9.0.40",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-extra-types>=2.11.1",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.15.1",
    "python-multipart>=0.0.32",
    "sqlalchemy[asyncio]>=2.1.1",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "UP",
    "B",
    "SIM",
    "RUF",
    "ASYNC",
    "FAST",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
    "basedpyright>=1.40.2"
]

[tool.basedpyright]
extraPaths = ["src"]
typeCheckingMode = "standard"
